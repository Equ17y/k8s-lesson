apiVersion: v1
kind: Pod
metadata:
  name: django-clearsessions
  labels:
    app: django
    job: clearsessions
spec:
  restartPolicy: Never
  containers:
    - name: django
      image: django_app:latest
      imagePullPolicy: IfNotPresent
      command: ["python", "manage.py", "clearsessions"]
      env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DATABASE_URL
        - name: DEBUG
          value: "FALSE"
        - name: ALLOWED_HOSTS
          value: "*"