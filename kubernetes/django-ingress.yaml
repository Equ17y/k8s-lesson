apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"  # ← Отключаем редирект на HTTPS
spec:
  rules:
    - host: star-burger.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 80